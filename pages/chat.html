      <!-- @include sidebar -->

            <h1 class="text-2xl font-semibold text-gray-800">Chat</h1>
            <nav class="breadcrumb mt-1">
              <span class="breadcrumb-item"><a href="/">Home</a></span>

          <div class="card overflow-hidden">

              <div class="overflow-y-auto border-r border-gray-200">
                <div class="border-b border-gray-200 p-3">
                  <input
                    aria-label="Search contacts"
                    class="form-control"
                    placeholder="Search contacts..."
                  />
                </div>

                <a href="#" class="flex items-center gap-3 bg-blue-50 p-3 hover:bg-gray-50">
                  <div class="relative">
                    <img
                      alt=""
                      src="/assets/img/avatars/alexander-pierce-3b82f6.svg"
                      class="h-10 w-10 rounded-full"
                    /><span
                      class="absolute right-0 bottom-0 h-3 w-3 rounded-full border-2 border-white bg-green-500"
                    ></span>
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex justify-between">
                      <span class="text-sm font-medium text-gray-800">Alexander Pierce</span
                      ><span class="text-xs text-gray-400">3m</span>
                    </div>
                    <p class="truncate text-xs text-gray-500">Sure, sounds good!</p>
                  </div>
                </a>
                <a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-50">

                    <img

                  </div>
                </a>
                <a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-50">
                  <div class="relative">
                    <img
                      alt=""
                      src="/assets/img/avatars/nora-silvester-3b82f6.svg"

                    /><span
                      class="absolute right-0 bottom-0 h-3 w-3 rounded-full border-2 border-white bg-gray-400"

                    <p class="truncate text-xs text-gray-500">Can you review?</p>
                  </div>
                </a>
              </div>
              <div class="flex flex-col md:col-span-2">
                <div class="flex-1 space-y-4 overflow-y-auto bg-gray-50 p-4">
                  <div class="flex gap-2">
                    <img
                      alt=""
                      src="/assets/img/avatars/alexander-pierce-3b82f6.svg"
                      class="h-8 w-8 rounded-full"
                    />

                      Hey, did you get a chance to look at the proposal?
                    </div>

                    <img
                      alt=""
                      src="/assets/img/avatars/you-3b82f6.svg"
                      class="h-8 w-8 rounded-full"
                    />
                    <div
                      class="rounded-lg rounded-tr-none bg-blue-500 px-3 py-2 text-sm text-white"
                    >
                      Yes! Looks great, sending feedback now.
                    </div>
                  </div>
                  <div class="flex gap-2">
                    <img
                      alt=""
                      src="/assets/img/avatars/alexander-pierce-3b82f6.svg"
                      class="h-8 w-8 rounded-full"

                      class="rounded-lg rounded-tl-none bg-white px-3 py-2 text-sm text-gray-700 shadow-sm"

                      Perfect, thanks!
                    </div>
                  </div>
                </div>
                <div class="border-t border-gray-200 p-3">
                  <form class="flex gap-2" onsubmit="return false">
                    <input
                      aria-label="Type a message"
                      class="form-control flex-1"
                      placeholder="Type a message..."
                    /><button class="btn btn-primary">Send</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
