<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar | AdminLTE Tailwind</title>
    <meta
      name="description"
      content="Calendar · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AdminLTE Tailwind" />
    <meta property="og:title" content="Calendar | AdminLTE Tailwind" />
    <meta
      property="og:description"
      content="Calendar · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calendar | AdminLTE Tailwind" />
    <meta
      name="twitter:description"
      content="Calendar · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="h-full bg-gray-100">
    <div class="app-wrapper min-h-full">
      <!-- Navbar -->
      <!-- @include navbar -->

      <!-- Sidebar -->
      <!-- @include sidebar -->

      <div class="sidebar-overlay"></div>

      <!-- Main Content -->
      <main class="main-content ml-sidebar min-h-screen pt-14 transition-[margin] duration-300">
        <div class="p-6">
          <!-- Page Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">Calendar</h1>
            <nav class="breadcrumb mt-1">
              <span class="breadcrumb-item"><a href="/">Home</a></span>
              <span class="breadcrumb-item"><a href="#">Applications</a></span>
              <span class="breadcrumb-item active">Calendar</span>
            </nav>
          </div>

          <div class="grid grid-cols-1 gap-6 lg:grid-cols-4">
            <!-- Left column -->
            <div class="space-y-6 lg:col-span-1">
              <!-- Create + draggable events -->
              <div class="card">
                <div class="card-body">
                  <button id="cal-create" class="btn btn-primary w-full">
                    <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 4v16m8-8H4"
                      />
                    </svg>
                    Create New Event
                  </button>
                  <hr class="my-4 border-gray-200" />
                  <p class="mb-2 text-xs font-semibold tracking-wider text-gray-400 uppercase">
                    Drag onto a day
                  </p>
                  <div id="external-events" class="space-y-2">
                    <div
                      class="cal-ext-event flex cursor-grab items-center gap-2 rounded-lg p-2.5 text-white select-none active:cursor-grabbing"
                      draggable="true"
                      data-title="Meeting"
                      data-color="blue"
                      style="background-color: #3b82f6"
                    >
                      <svg class="h-4 w-4 opacity-80" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="9" cy="6" r="1.6" />
                        <circle cx="15" cy="6" r="1.6" />
                        <circle cx="9" cy="12" r="1.6" />
                        <circle cx="15" cy="12" r="1.6" />
                        <circle cx="9" cy="18" r="1.6" />
                        <circle cx="15" cy="18" r="1.6" />
                      </svg>
                      <span class="text-sm font-medium">Meeting</span>
                    </div>
                    <div
                      class="cal-ext-event flex cursor-grab items-center gap-2 rounded-lg p-2.5 text-white select-none active:cursor-grabbing"
                      draggable="true"
                      data-title="Lunch"
                      data-color="green"
                      style="background-color: #22c55e"
                    >
                      <svg class="h-4 w-4 opacity-80" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="9" cy="6" r="1.6" />
                        <circle cx="15" cy="6" r="1.6" />
                        <circle cx="9" cy="12" r="1.6" />
                        <circle cx="15" cy="12" r="1.6" />
                        <circle cx="9" cy="18" r="1.6" />
                        <circle cx="15" cy="18" r="1.6" />
                      </svg>
                      <span class="text-sm font-medium">Lunch</span>
                    </div>
                    <div
                      class="cal-ext-event flex cursor-grab items-center gap-2 rounded-lg p-2.5 text-white select-none active:cursor-grabbing"
                      draggable="true"
                      data-title="Reminder"
                      data-color="amber"
                      style="background-color: #f59e0b"
                    >
                      <svg class="h-4 w-4 opacity-80" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="9" cy="6" r="1.6" />
                        <circle cx="15" cy="6" r="1.6" />
                        <circle cx="9" cy="12" r="1.6" />
                        <circle cx="15" cy="12" r="1.6" />
                        <circle cx="9" cy="18" r="1.6" />
                        <circle cx="15" cy="18" r="1.6" />
                      </svg>
                      <span class="text-sm font-medium">Reminder</span>
                    </div>
                    <div
                      class="cal-ext-event flex cursor-grab items-center gap-2 rounded-lg p-2.5 text-white select-none active:cursor-grabbing"
                      draggable="true"
                      data-title="Deadline"
                      data-color="red"
                      style="background-color: #ef4444"
                    >
                      <svg class="h-4 w-4 opacity-80" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="9" cy="6" r="1.6" />
                        <circle cx="15" cy="6" r="1.6" />
                        <circle cx="9" cy="12" r="1.6" />
                        <circle cx="15" cy="12" r="1.6" />
                        <circle cx="9" cy="18" r="1.6" />
                        <circle cx="15" cy="18" r="1.6" />
                      </svg>
                      <span class="text-sm font-medium">Deadline</span>
                    </div>
                    <div
                      class="cal-ext-event flex cursor-grab items-center gap-2 rounded-lg p-2.5 text-white select-none active:cursor-grabbing"
                      draggable="true"
                      data-title="Conference"
                      data-color="purple"
                      style="background-color: #a855f7"
                    >
                      <svg class="h-4 w-4 opacity-80" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="9" cy="6" r="1.6" />
                        <circle cx="15" cy="6" r="1.6" />
                        <circle cx="9" cy="12" r="1.6" />
                        <circle cx="15" cy="12" r="1.6" />
                        <circle cx="9" cy="18" r="1.6" />
                        <circle cx="15" cy="18" r="1.6" />
                      </svg>
                      <span class="text-sm font-medium">Conference</span>
                    </div>
                  </div>
                  <label class="mt-3 flex cursor-pointer items-center gap-2">
                    <input id="cal-remove-after" type="checkbox" class="h-4 w-4" />
                    <span class="text-sm text-gray-600">Remove after drop</span>
                  </label>
                </div>
              </div>

              <!-- Categories filter -->
              <div class="card">
                <div class="card-header">
                  <h3 class="text-base font-medium text-gray-800">Categories</h3>
                </div>
                <div class="card-body">
                  <div id="cal-filters" class="space-y-2.5"></div>
                </div>
              </div>

              <!-- Upcoming -->
              <div class="card">
                <div class="card-header">
                  <h3 class="text-base font-medium text-gray-800">Upcoming Events</h3>
                </div>
                <div class="card-body">
                  <div id="cal-upcoming" class="space-y-3"></div>
                </div>
              </div>
            </div>

            <!-- Calendar -->
            <div class="lg:col-span-3">
              <div class="card">
                <div class="card-body p-0">
                  <!-- Calendar Header -->
                  <div
                    class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 p-4"
                  >
                    <div class="flex items-center gap-2">
                      <button
                        id="cal-prev"
                        class="btn btn-outline-secondary btn-sm"
                        aria-label="Previous month"
                      >
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 19l-7-7 7-7"
                          />
                        </svg>
                      </button>
                      <button
                        id="cal-next"
                        class="btn btn-outline-secondary btn-sm"
                        aria-label="Next month"
                      >
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M9 5l7 7-7 7"
                          />
                        </svg>
                      </button>
                      <button id="cal-today" class="btn btn-outline-secondary btn-sm">Today</button>
                    </div>
                    <h2 id="cal-title" class="text-lg font-semibold text-gray-800">&mdash;</h2>
                    <div class="inline-flex overflow-hidden rounded-lg border border-gray-200">
                      <button
                        data-view="month"
                        class="cal-view-btn px-3 py-1.5 text-sm font-medium transition-colors"
                      >
                        Month
                      </button>
                      <button
                        data-view="list"
                        class="cal-view-btn border-l border-gray-200 px-3 py-1.5 text-sm font-medium transition-colors"
                      >
                        List
                      </button>
                    </div>
                  </div>

                  <!-- Month view -->
                  <div id="cal-month">
                    <div
                      class="grid grid-cols-7 border-b border-gray-200 text-center text-xs font-semibold tracking-wider text-gray-400 uppercase"
                    >
                      <div class="py-2">Sun</div>
                      <div class="py-2">Mon</div>
                      <div class="py-2">Tue</div>
                      <div class="py-2">Wed</div>
                      <div class="py-2">Thu</div>
                      <div class="py-2">Fri</div>
                      <div class="py-2">Sat</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7"></div>
                  </div>

                  <!-- List view -->
                  <div id="cal-list" class="hidden"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <!-- @include footer -->
      </main>
    </div>

    <!-- Calendar Event Modal -->
    <div
      id="cal-modal"
      class="pointer-events-none fixed inset-0 z-[60] flex items-center justify-center p-4 opacity-0 transition-opacity duration-200"
    >
      <div class="absolute inset-0 bg-black/50" data-cal-close></div>
      <div
        id="cal-modal-panel"
        class="relative max-h-[90vh] w-full max-w-md scale-95 overflow-y-auto rounded-xl border border-gray-200 bg-white shadow-xl transition-transform duration-200"
      >
        <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
          <h3 id="cal-modal-title" class="text-lg font-semibold text-gray-800">Add Event</h3>
          <button
            type="button"
            data-cal-close
            class="rounded-lg p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600"
            aria-label="Close"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <form id="cal-form" class="space-y-4 px-5 py-4">
          <input type="hidden" id="cal-ev-id" />
          <div>
            <label class="form-label" for="cal-ev-title">Event Title</label>
            <input
              id="cal-ev-title"
              type="text"
              class="form-control"
              placeholder="e.g. Team standup"
              required
            />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="form-label" for="cal-ev-start">Start Date</label>
              <input id="cal-ev-start" type="date" class="form-control" required />
            </div>
            <div>
              <label class="form-label" for="cal-ev-end">End Date</label>
              <input id="cal-ev-end" type="date" class="form-control" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="form-label" for="cal-ev-time">Time</label>
              <input id="cal-ev-time" type="time" class="form-control" />
            </div>
            <div>
              <label class="form-label" for="cal-ev-color">Category</label>
              <select id="cal-ev-color" class="form-control">
                <option value="blue">Meeting</option>
                <option value="green">Personal</option>
                <option value="amber">Reminder</option>
                <option value="red">Important</option>
                <option value="purple">Other</option>
              </select>
            </div>
          </div>
          <label class="flex cursor-pointer items-center gap-2">
            <input id="cal-ev-allday" type="checkbox" class="h-4 w-4" />
            <span class="text-sm text-gray-700">All day</span>
          </label>
          <div>
            <label class="form-label" for="cal-ev-desc">Description</label>
            <textarea
              id="cal-ev-desc"
              rows="3"
              class="form-control"
              placeholder="Optional notes..."
            ></textarea>
          </div>
        </form>
        <div class="flex items-center gap-2 border-t border-gray-200 px-5 py-4">
          <button type="button" id="cal-delete" class="btn btn-outline-danger btn-sm hidden">
            Delete
          </button>
          <div class="ml-auto flex items-center gap-2">
            <button type="button" data-cal-close class="btn btn-outline-secondary btn-sm">
              Cancel
            </button>
            <button type="button" id="cal-save" class="btn btn-primary btn-sm">Save Event</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
