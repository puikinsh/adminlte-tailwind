<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | AdminLTE Tailwind</title>
    <meta
      name="description"
      content="Settings · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AdminLTE Tailwind" />
    <meta property="og:title" content="Settings | AdminLTE Tailwind" />
    <meta
      property="og:description"
      content="Settings · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Settings | AdminLTE Tailwind" />
    <meta
      name="twitter:description"
      content="Settings · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="h-full bg-gray-100">
    <div class="app-wrapper min-h-full">
      <!-- Navbar -->
      <!-- @include navbar -->

      <!-- Sidebar -->
      <!-- @include sidebar -->

      <div class="sidebar-overlay"></div>

      <!-- Main Content -->
      <main class="main-content ml-sidebar min-h-screen pt-14 transition-[margin] duration-300">
        <div class="p-6">
          <!-- Page Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">Settings</h1>
            <nav class="breadcrumb mt-1">
              <span class="breadcrumb-item"><a href="/">Home</a></span>
              <span class="breadcrumb-item active">Settings</span>
            </nav>
          </div>

          <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
            <div class="card lg:col-span-2">
              <div class="card-header">
                <h2 class="text-lg font-medium text-gray-800">Profile Settings</h2>
              </div>
              <div class="card-body space-y-4">
                <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                  <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700" for="first-name"
                      >First Name</label
                    ><input id="first-name" class="form-control" value="Jane" />
                  </div>
                  <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700" for="last-name"
                      >Last Name</label
                    ><input id="last-name" class="form-control" value="Cooper" />
                  </div>
                </div>
                <div>
                  <label class="mb-1 block text-sm font-medium text-gray-700" for="email"
                    >Email</label
                  ><input id="email" type="email" class="form-control" value="jane@example.com" />
                </div>
                <div>
                  <label class="mb-1 block text-sm font-medium text-gray-700" for="bio">Bio</label
                  ><textarea id="bio" class="form-control" rows="3">
Product designer based in SF.</textarea>
                </div>
                <button class="btn btn-primary">Save Changes</button>
              </div>
            </div>
            <div class="card">
              <div class="card-header">
                <h2 class="text-lg font-medium text-gray-800">Notifications</h2>
              </div>
              <div class="card-body space-y-4">
                <label class="flex cursor-pointer items-center justify-between">
                  <span class="text-sm text-gray-700">Email notifications</span>
                  <input type="checkbox" checked class="h-4 w-4" />
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span class="text-sm text-gray-700">Push notifications</span>
                  <input type="checkbox" checked class="h-4 w-4" />
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span class="text-sm text-gray-700">Weekly digest</span>
                  <input type="checkbox" class="h-4 w-4" />
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span class="text-sm text-gray-700">Product updates</span>
                  <input type="checkbox" checked class="h-4 w-4" />
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <!-- @include footer -->
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
