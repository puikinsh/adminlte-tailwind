<html lang="en" class="h-full">
  <head>

    <meta property="og:title" content="Projects | AdminLTE Tailwind" />

      property="og:description"
      content="Projects · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Projects | AdminLTE Tailwind" />
    <meta
      name="twitter:description"
      content="Projects · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />

  </head>
  <body class="h-full bg-gray-100">
    <div class="app-wrapper min-h-full">
      <!-- Navbar -->
      <!-- @include navbar -->

      <!-- Sidebar -->
      <!-- @include sidebar -->

      <div class="sidebar-overlay"></div>

      <!-- Main Content -->
      <main class="main-content ml-sidebar min-h-screen pt-14 transition-[margin] duration-300">
        <div class="p-6">
          <!-- Page Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">Projects</h1>
            <nav class="breadcrumb mt-1">
              <span class="breadcrumb-item"><a href="/">Home</a></span>
              <span class="breadcrumb-item active">Projects</span>
            </nav>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="text-lg font-medium text-gray-800">Projects</h2>
              <button class="btn btn-primary btn-sm">+ New Project</button>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Project</th>
                      <th>Team</th>
                      <th>Progress</th>
                      <th>Status</th>
                      <th class="text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td class="font-medium text-gray-800">Website Redesign</td>
                      <td>
                        <div class="flex -space-x-2">
                          <img
                            alt=""
                            src="/assets/img/avatars/jane-cooper-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Jane Cooper"
                          /><img
                            alt=""
                            src="/assets/img/avatars/mike-ross-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Mike Ross"
                          /><img
                            alt=""
                            src="/assets/img/avatars/sara-lee-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Sara Lee"
                          />
                        </div>
                      </td>
                      <td>
                        <div class="flex items-center gap-2">
                          <div class="progress progress-sm w-32">
                            <div class="progress-bar progress-bar-primary" style="width: 78%"></div>
                          </div>
                          <span class="text-xs text-gray-500">78%</span>
                        </div>
                      </td>
                      <td><span class="badge badge-primary">In Progress</span></td>
                      <td class="text-right">
                        <button class="btn btn-xs btn-outline-secondary">View</button>
                      </td>
                    </tr>
                    <tr>
                      <td class="font-medium text-gray-800">Mobile App v2</td>
                      <td>
                        <div class="flex -space-x-2">
                          <img
                            alt=""
                            src="/assets/img/avatars/tom-hardy-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Tom Hardy"
                          /><img
                            alt=""
                            src="/assets/img/avatars/anna-bell-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Anna Bell"
                          />
                        </div>
                      </td>
                      <td>
                        <div class="flex items-center gap-2">
                          <div class="progress progress-sm w-32">
                            <div class="progress-bar progress-bar-primary" style="width: 45%"></div>
                          </div>
                          <span class="text-xs text-gray-500">45%</span>
                        </div>
                      </td>
                      <td><span class="badge badge-primary">In Progress</span></td>
                      <td class="text-right">
                        <button class="btn btn-xs btn-outline-secondary">View</button>
                      </td>
                    </tr>
                    <tr>
                      <td class="font-medium text-gray-800">Marketing Site</td>
                      <td>
                        <div class="flex -space-x-2">
                          <img
                            alt=""
                            src="/assets/img/avatars/leo-king-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Leo King"
                          />
                        </div>
                      </td>
                      <td>
                        <div class="flex items-center gap-2">
                          <div class="progress progress-sm w-32">
                            <div
                              class="progress-bar progress-bar-primary"
                              style="width: 100%"
                            ></div>
                          </div>
                          <span class="text-xs text-gray-500">100%</span>
                        </div>
                      </td>
                      <td><span class="badge badge-success">Completed</span></td>
                      <td class="text-right">
                        <button class="btn btn-xs btn-outline-secondary">View</button>
                      </td>
                    </tr>
                    <tr>
                      <td class="font-medium text-gray-800">API Platform</td>
                      <td>
                        <div class="flex -space-x-2">
                          <img
                            alt=""
                            src="/assets/img/avatars/dana-scott-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Dana Scott"
                          /><img
                            alt=""
                            src="/assets/img/avatars/raj-patel-3b82f6.svg"
                            class="h-8 w-8 rounded-full border-2 border-white"
                            title="Raj Patel"
                          />
                        </div>
                      </td>
                      <td>
                        <div class="flex items-center gap-2">
                          <div class="progress progress-sm w-32">
                            <div class="progress-bar progress-bar-primary" style="width: 12%"></div>
                          </div>
                          <span class="text-xs text-gray-500">12%</span>
                        </div>
                      </td>
                      <td><span class="badge badge-warning">On Hold</span></td>
                      <td class="text-right">
                        <button class="btn btn-xs btn-outline-secondary">View</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <!-- @include footer -->
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
