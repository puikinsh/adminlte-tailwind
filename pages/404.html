    <meta

      content="404 - Page Not Found · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="404 - Page Not Found | AdminLTE Tailwind" />
    <meta
      name="twitter:description"
      content="404 - Page Not Found · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta name="twitter:image" content="/og-image.png" />

  </head>
  <body class="h-full bg-gray-100">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="text-center">
        <!-- 404 Illustration -->
        <div class="mb-8">
          <h1 class="text-9xl font-bold text-blue-600">404</h1>
          <div class="relative mt-4 inline-block">
            <svg
              class="h-48 w-64 text-gray-300"
              viewBox="0 0 200 150"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <!-- Simple illustration of a confused person -->
              <circle cx="100" cy="50" r="30" class="text-gray-400" />
              <path d="M85 45 Q90 40 95 45" class="text-gray-500" />
              <path d="M105 45 Q110 40 115 45" class="text-gray-500" />
              <path d="M90 60 Q100 55 110 60" class="text-gray-500" />
              <path d="M70 80 Q100 100 130 80" class="text-gray-400" />
              <path d="M80 80 L80 130" class="text-gray-400" />
              <path d="M120 80 L120 130" class="text-gray-400" />
              <path d="M80 130 L70 145" class="text-gray-400" />
              <path d="M80 130 L90 145" class="text-gray-400" />
              <path d="M120 130 L110 145" class="text-gray-400" />
              <path d="M120 130 L130 145" class="text-gray-400" />
              <!-- Question marks -->
              <text x="50" y="30" class="text-2xl text-gray-400">?</text>
              <text x="140" y="40" class="text-3xl text-gray-400">?</text>
              <text x="160" y="20" class="text-xl text-gray-400">?</text>
            </svg>
          </div>
        </div>

        <!-- Error Message -->
        <h2 class="mb-4 text-3xl font-bold text-gray-800">Oops! Page Not Found</h2>
        <p class="mx-auto mb-8 max-w-md text-gray-600">
          The page you are looking for might have been removed, had its name changed, or is
          temporarily unavailable.
        </p>

        <!-- Search Form -->
        <div class="mx-auto mb-8 max-w-md">
          <form class="flex gap-2">
            <div class="relative flex-1">
              <input type="text" class="form-control pl-10" placeholder="Search for pages..." />
              <svg
                class="absolute top-1/2 left-3 h-5 w-5 -translate-y-1/2 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap justify-center gap-4">
          <a href="/" class="btn btn-primary btn-lg">
            <svg class="mr-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            Go Home
          </a>
          <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
            <svg class="mr-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            Go Back
          </button>
        </div>

        <!-- Quick Links -->
        <div class="mt-12">
          <p class="mb-4 text-sm text-gray-500">Or try one of these pages:</p>
          <div class="flex flex-wrap justify-center gap-3">
            <a href="/index.html" class="text-blue-600 hover:underline">Dashboard</a>
            <span class="text-gray-300">|</span>
            <a href="/UI/general.html" class="text-blue-600 hover:underline">UI Elements</a>
            <span class="text-gray-300">|</span>
            <a href="/forms/elements.html" class="text-blue-600 hover:underline">Forms</a>
            <span class="text-gray-300">|</span>
            <a href="/tables/simple.html" class="text-blue-600 hover:underline">Tables</a>
          </div>
        </div>

        <!-- Footer -->
        <p class="mt-12 text-sm text-gray-400">&copy; 2026 AdminLTE. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
