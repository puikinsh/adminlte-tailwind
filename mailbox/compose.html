<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compose | AdminLTE Tailwind</title>
    <meta
      name="description"
      content="Compose · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AdminLTE Tailwind" />
    <meta property="og:title" content="Compose | AdminLTE Tailwind" />
    <meta
      property="og:description"
      content="Compose · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Compose | AdminLTE Tailwind" />
    <meta
      name="twitter:description"
      content="Compose · AdminLTE Tailwind — a responsive, dark-mode admin dashboard template built with Tailwind CSS v4."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="h-full bg-gray-100">
    <div class="app-wrapper min-h-full">
      <!-- Navbar -->
      <!-- @include navbar -->

      <!-- Sidebar -->
      <!-- @include sidebar -->

      <div class="sidebar-overlay"></div>

      <!-- Main Content -->
      <main class="main-content ml-sidebar min-h-screen pt-14 transition-[margin] duration-300">
        <div class="p-6">
          <!-- Page Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">Compose</h1>
            <nav class="breadcrumb mt-1">
              <span class="breadcrumb-item"><a href="/">Home</a></span>
              <span class="breadcrumb-item active">Compose</span>
            </nav>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="text-lg font-medium text-gray-800">Compose New Message</h3>
            </div>
            <div class="card-body space-y-4">
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700" for="to">To</label
                ><input id="to" class="form-control" placeholder="recipient@example.com" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700" for="subject"
                  >Subject</label
                ><input id="subject" class="form-control" placeholder="Subject" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700" for="message"
                  >Message</label
                ><textarea
                  id="message"
                  class="form-control"
                  rows="10"
                  placeholder="Write your message..."
                ></textarea>
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-gray-700" for="attachments"
                  >Attachments</label
                ><input id="attachments" type="file" multiple class="block text-sm text-gray-600" />
              </div>
            </div>
            <div class="card-footer flex justify-between">
              <button class="btn btn-primary">Send</button>
              <button class="btn btn-outline-secondary">Discard</button>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <!-- @include footer -->
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
